version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: backend
    ports:
      - '3001:3001'
    volumes:
      - q_data:/app/data
    environment:
      - DATABASE_URL=file:./data/q.db
      - JWT_SECRET=${JWT_SECRET:-q-dev-secret-change-me}
      # Must stay fixed forever once any tenant has saved an encrypted field
      # (Settings > Model) — the backend falls back to auto-generating a
      # random key on the container's own ephemeral filesystem otherwise,
      # which silently orphans previously-encrypted data on every rebuild.
      - Q_ENCRYPTION_KEY=${Q_ENCRYPTION_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_URL=http://chromadb:8000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      # Ollama runs on the host, not as a compose service — "localhost" from
      # inside this container means the container itself, so this must point
      # at the Docker host bridge instead. Override with DOCKER_OLLAMA_URL if
      # your .env's OLLAMA_URL (meant for non-Docker local dev) isn't right here.
      - OLLAMA_URL=${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - PORT=3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - chromadb
    networks:
      - default
      - web

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://api.opentam.io}
    container_name: dashboard
    ports:
      - '3000:3000'
    environment:
      - BACKEND_URL=http://backend:3001
      - Q_SECRET_KEY=${Q_SECRET_KEY:-sk_test_acme}
      - Q_SDK_KEY=${Q_SDK_KEY:-sdk_test_acme}
    depends_on:
      - backend
    networks:
      - default
      - web

  proxy:
    build:
      context: .
      dockerfile: packages/proxy/Dockerfile
    ports:
      - '3002:3002'
    environment:
      - Q_BACKEND_URL=http://backend:3001
      - Q_SDK_KEY=${Q_SDK_KEY:-sdk_test_acme}
      - PROXY_PORT=3002
    depends_on:
      - backend

volumes:
  chroma_data:
  q_data:

networks:
  web:
    external: true
